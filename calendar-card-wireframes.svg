<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Three polished calendar card wireframe directions</title>
  <desc id="desc">A comparison board showing schedule-led, time-led, and operational card layouts for a pet booking calendar.</desc>
  <style>
    .bg { fill: #F7F4EF; }
    .ink { fill: #292523; }
    .muted { fill: #716B66; }
    .soft { fill: #EDE8E0; }
    .line { stroke: #D7D0C7; stroke-width: 2; }
    .card { fill: #FFFFFF; stroke: #D7D0C7; stroke-width: 2; }
    .accent { fill: #284C70; }
    .accent-soft { fill: #DCE9F5; }
    .success { fill: #E4F1E6; }
    .success-ink { fill: #27613A; }
    .h1 { font: 700 36px Arial, sans-serif; }
    .h2 { font: 700 24px Arial, sans-serif; }
    .h3 { font: 700 28px Arial, sans-serif; }
    .body { font: 400 22px Arial, sans-serif; }
    .small { font: 400 18px Arial, sans-serif; }
    .label { font: 700 15px Arial, sans-serif; letter-spacing: 1.6px; }
    .date { font: 700 32px Arial, sans-serif; }
    .time { font: 700 36px Arial, sans-serif; }
  </style>

  <rect class="bg" width="1600" height="1120"/>
  <text x="100" y="102" class="h1 ink">Calendar card directions</text>
  <text x="100" y="140" class="body muted">Same booking, reorganised for a quicker and calmer scan.</text>

  <!-- Option A -->
  <text x="100" y="230" class="label accent">A · SCHEDULE-LED</text>
  <text x="100" y="268" class="h2 ink">Date rail + one clear event story</text>
  <text x="100" y="300" class="small muted">Best for a dense calendar list. The date is visible before the details.</text>
  <rect x="100" y="338" width="430" height="574" rx="18" class="card"/>
  <rect x="100" y="338" width="112" height="574" rx="18" class="accent-soft"/>
  <path d="M194 338h318a18 18 0 0 1 18 18v538a18 18 0 0 1-18 18H194z" fill="#FFFFFF"/>
  <text x="130" y="404" class="label accent">SUN</text>
  <text x="130" y="452" class="date ink">26</text>
  <text x="130" y="486" class="small muted">OCT</text>
  <line x1="128" y1="520" x2="184" y2="520" class="line"/>
  <text x="130" y="560" class="label muted">2026</text>
  <circle cx="156" cy="785" r="26" fill="#FFFFFF" stroke="#A8C2DA" stroke-width="2"/>
  <path d="M148 785l6 6 12-14" fill="none" stroke="#284C70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="242" y="376" width="116" height="34" rx="17" class="success"/>
  <text x="261" y="399" class="label success-ink">ACCEPTED</text>
  <text x="242" y="464" class="h3 ink">Buddy, shrek</text>
  <text x="242" y="504" class="body ink">Kieran Test Owner</text>
  <line x1="242" y1="536" x2="488" y2="536" class="line"/>
  <text x="242" y="586" class="label muted">TIME</text>
  <text x="242" y="628" class="body ink">9:00 am – 12:00 pm</text>
  <text x="242" y="678" class="label muted">SERVICE FEE</text>
  <text x="242" y="718" class="body ink">$40</text>
  <line x1="242" y1="760" x2="488" y2="760" class="line"/>
  <text x="242" y="806" class="small accent">View booking details →</text>

  <!-- Option B -->
  <text x="585" y="230" class="label accent">B · TIME-LED</text>
  <text x="585" y="268" class="h2 ink">Time first, then the people and pet</text>
  <text x="585" y="300" class="small muted">Best when the user plans their day around time blocks.</text>
  <rect x="585" y="338" width="430" height="574" rx="18" class="card"/>
  <rect x="585" y="338" width="430" height="148" rx="18" class="accent"/>
  <path d="M585 468h430v426a18 18 0 0 1-18 18H603a18 18 0 0 1-18-18z" fill="#FFFFFF"/>
  <text x="622" y="382" class="label" fill="#DCE9F5">SUN, 26 OCT 2026</text>
  <text x="622" y="436" class="time" fill="#FFFFFF">9:00 am – 12:00 pm</text>
  <circle cx="650" cy="562" r="35" class="accent-soft"/>
  <circle cx="638" cy="554" r="9" fill="#284C70"/>
  <circle cx="662" cy="554" r="9" fill="#284C70"/>
  <path d="M632 576c10 9 25 9 36 0" fill="none" stroke="#284C70" stroke-width="3" stroke-linecap="round"/>
  <text x="705" y="554" class="h3 ink">Buddy, shrek</text>
  <text x="705" y="588" class="small muted">Kieran Test Owner</text>
  <rect x="622" y="646" width="116" height="34" rx="17" class="success"/>
  <text x="641" y="669" class="label success-ink">ACCEPTED</text>
  <text x="622" y="740" class="label muted">BOOKING SUMMARY</text>
  <text x="622" y="778" class="body ink">3 hours</text>
  <text x="846" y="778" class="body ink">$40</text>
  <line x1="622" y1="812" x2="978" y2="812" class="line"/>
  <text x="622" y="858" class="small accent">Open booking →</text>

  <!-- Option C -->
  <text x="1070" y="230" class="label accent">C · OPERATIONAL</text>
  <text x="1070" y="268" class="h2 ink">Compact booking summary with actions</text>
  <text x="1070" y="300" class="small muted">Best when bookings need quick decisions or follow-up work.</text>
  <rect x="1070" y="338" width="430" height="574" rx="18" class="card"/>
  <rect x="1102" y="372" width="116" height="34" rx="17" class="success"/>
  <text x="1121" y="395" class="label success-ink">ACCEPTED</text>
  <circle cx="1456" cy="389" r="18" class="soft"/>
  <circle cx="1448" cy="389" r="2.5" class="accent"/><circle cx="1456" cy="389" r="2.5" class="accent"/><circle cx="1464" cy="389" r="2.5" class="accent"/>
  <text x="1102" y="474" class="h3 ink">Buddy, shrek</text>
  <text x="1102" y="510" class="body muted">with Kieran Test Owner</text>
  <rect x="1102" y="550" width="366" height="92" rx="12" class="soft"/>
  <text x="1126" y="584" class="label muted">SUNDAY, 26 OCT</text>
  <text x="1126" y="620" class="body ink">9:00 am – 12:00 pm</text>
  <line x1="1102" y1="690" x2="1468" y2="690" class="line"/>
  <text x="1102" y="736" class="small muted">Service fee</text>
  <text x="1404" y="736" class="body ink">$40</text>
  <rect x="1102" y="780" width="180" height="62" rx="10" class="accent"/>
  <text x="1131" y="819" class="body" fill="#FFFFFF">View details</text>
  <rect x="1300" y="780" width="168" height="62" rx="10" fill="#FFFFFF" stroke="#A8C2DA" stroke-width="2"/>
  <text x="1331" y="819" class="body accent">Message</text>

  <!-- Footer -->
  <line x1="100" y1="984" x2="1500" y2="984" class="line"/>
  <text x="100" y="1030" class="h2 ink">My recommendation: A</text>
  <text x="100" y="1070" class="body muted">It fixes the current card’s loose hierarchy without adding visual weight: status, pet, owner, timing, and price each have a predictable home.</text>
</svg>
